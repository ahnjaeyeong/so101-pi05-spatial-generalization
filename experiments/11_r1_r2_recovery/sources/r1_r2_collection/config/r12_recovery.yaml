  pan_correction_min_deg: 5
  gripper_open_min: 15
  close_drop_min: 8
  pan_reversals_max: 2
  path_ratio_max: 2.5
  time_align_tol_s: 0.002

checklist:
  RC:
    - "이 세션은 회복 시연 (F1 사선 하강 4 · F2 이른 닫힘 4 · F3 정렬 오차 4). 실패 자세는 준비 단계(녹화 안 함)에서 만들고, 녹화는 회복부터"
    - "F1 은 그리퍼 열림, F2 · F3 은 그리퍼 닫힘으로 시작. 큐브에 닿지 않게, 큐브 앞에서 닫는 동작(빈 파지)은 하지 않음"
    - "영상 창 F11 = 실제 실패 대표 영상 (review/failure_types)"
    - "끝낼 때(Esc) 팔을 쉬는 자세에 두기 — 종료하면 토크가 꺼져요"

# 보호 설정 (파일럿 12편과 같음 · 기존 safety 키는 그대로 · 완화 없음)
safety:
  teleop_guard:
    enabled: true
    pan_cmd_abs_max_deg: 95
    hold_gap_deg: 25
    release_gap_deg: 10
    warn_gap_deg: 15
    warn_s: 1.0
    invalidate_in_rec: true
