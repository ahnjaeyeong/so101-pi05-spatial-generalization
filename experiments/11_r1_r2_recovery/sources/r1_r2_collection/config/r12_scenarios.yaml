# R1/R2 추가 시연 — 시나리오·수량·안전 범위 (2026-10-30)
# 읽는 곳: tools/r12_common.py (plan · record · preview · qa). 계획을 만든 뒤 이 파일을 바꾸면
# 이미 만든 r12_plan.csv 는 그대로이고, r12_plan_meta.json 에 계획 때 설정 사본이 남는다.
version: 1

# K 위치·front 보정(H)·색 검출 범위는 d2 와 같은 설정 파일에서 읽는다 (읽기만).
base_config: $HOME/so101_boxpick/config/redbox8_layouts.yaml

# d2 와 같은 과제 문장 (d2 tasks.parquet: task_index 0 하나). R1/R2 구분은 세션·repo_id·r12_episodes.csv 로 한다.
task_text: pick up the red cube and put it in the brown box
fps: 30

groups:
  r1_pilot:
    type: R1
    session: main_k8/r1_realign_pilot
    repo_id: oxr/so101_k8_r1_realign_pilot
    seed: 3101
    episode_time_s: 45
  r2_pilot:
    type: R2
    session: main_k8/r2_pregrasp_pilot
    repo_id: oxr/so101_k8_r2_pregrasp_pilot
    seed: 3201
    episode_time_s: 45
    # 2026-11-03 사용자 결정: R2 잠정 40 편 = AHEAD 8 · DEPTH 8 · LEFT 4 · RIGHT 4 · READY 8 · BELOW 8 (REGRASP 제외).
    #   R2-BELOW 교정 프로토콜 확정 전까지 '수집 준비 완료' 아님. 이미 만든 r12_plan.csv (32 편) 는 그대로 — 다시 만들지 않았음.
    #   근거: ~/so101_runs/main_k8/r2_grasp_diagnostic/R2_COLLECTION_CONDITIONS.md
    target_total: 40
    collection_status: draft   # draft = 조건만 정함 · 수집 준비 완료 아님 (R2-BELOW 교정 동작 미확정)
  # 시험 연습 (2026-10-30 사용자: 각 3회) — practice 세션, 본 파일럿과 분리. scenario_counts 가 시나리오 count 를 대신함
  r1_trial:
    type: R1
    session: practice/r1_trial
    repo_id: oxr/so101_r1_trial
    seed: 3191
    episode_time_s: 45
    scenario_counts: {R1-OVER: 1, R1-UNDER: 1, R1-TL: 1}   # 11-02: 녹화 중 어긋남 방식으로 바꿈 (전: R1-L/R/OL)
  # 11-02 R1 시험 (사용자: R1 만 시험) — 오후 정의 4 시나리오 1판씩, practice/r1_trial (옛 정의 3판) 과 분리
  r1_try:
    type: R1
    session: practice/r1_try
    repo_id: oxr/so101_r1_try
    seed: 3192
    episode_time_s: 45
    scenario_counts: {R1-PAN-L: 1, R1-PAN-R: 1, R1-OVER: 1, R1-DRIFT: 1}   # 11-02 오후 정의 — 사용자가 13:20 에 4편 녹화함 (그대로 둠)
  # 3차 지시서 R1 시험 — 셀 (시작 자세 × 손목 가시성) 마다 1판, 좌우 2/2. practice/r1_try 와 분리
  r1_try2:
    type: R1
    session: practice/r1_try2
    repo_id: oxr/so101_r1_try2
    seed: 3195   # 4편이 로봇 왼쪽·가운데·오른쪽 K 를 모두 쓰는 seed
    episode_time_s: 45
    scenario_counts: {R1-HOME-VIS: 1, R1-HOME-OUT: 1, R1-MID-VIS: 1, R1-MID-OUT: 1}   # 3차 정의 — 사용자가 13:52 에 2편 녹화 (그대로 둠)
  # 4차 지시서 R1 시험 — A · B1 · B2 · B3 1판씩 (K 2 · 자유 위치 2). practice/r1_try2 (3차 정의, 2편 녹화) 와 분리
  r1_try3:
    type: R1
    session: practice/r1_try3
    repo_id: oxr/so101_r1_try3
    seed: 3197   # 4편이 서로 다른 자리 (K 2 · 자유 점 2, 왼쪽·가운데·오른쪽), 좌우 2/2
    episode_time_s: 45
    scenario_counts: {R1-A: 1, R1-B1: 1, R1-B2: 1, R1-B3: 1}
  r2_trial:
    type: R2
    session: practice/r2_trial
    repo_id: oxr/so101_r2_trial
    seed: 3291
    episode_time_s: 45
    scenario_counts: {R2-AHEAD: 1, R2-LEFT: 1, R2-HIGH: 1}

# 큐브 자리: d2 와 같은 고정 위치 K1–K8 (redbox8_layouts.yaml known_positions). 각도도 d2 와 같은 4가지.
positions: [K1, K2, K3, K4, K5, K6, K7, K8]
# 자유 위치 (4차 지시서: K1–K8 만 반복하지 않음). 탁자 표시가 없어 사람이 대략 놓고, 실제 위치는 front H 검출로 기록 (cube_position_source).
# 점 = K 격자 사이 (d2 파지 거리 14–27 cm 안, front 화면 안). Pan 기준 = 기하 (-atan2 − 1.4°; K 에서 d2 중앙값과 −0.2…+3.1° 차이).
free_points: {F1: [-12.75, 19.0], F2: [-12.75, 4.0], F3: [-21.25, 26.5], F4: [-21.25, -3.5]}
# R1 계획의 큐브 자리: K 8 + 자유 점 8 (F1–F4 각 2)
r1_positions: [K1, K2, K3, K4, K5, K6, K7, K8, F1, F2, F3, F4, F1, F2, F3, F4]
angles: ["0", "L30", "R30", "45"]
# 2026-11-03: 계획의 각도 배정 (make_plan: 위 4 가지를 섞어 돌려 씀) 은 기존 그대로 — 새 고정 규칙을 추가하지 않음.

# K 마다 '큐브 가운데 pan' 기준값 (°): d2 구성 세션 redbox_t1_known + redbox_t3_known 의 판마다
# '열린 뒤 명령 그리퍼 <10 인데 팔로워 그리퍼 >6 이 5프레임 이어진 첫 프레임 (= 큐브를 쥔 순간)' 의 pan, K 별 중앙값 (n 15–16, 2026-10-30).
# 단순 기하 (-atan2 − 1.4°, robot.base_xy_cm) 와 차이 −0.2…+3.1°. FK 위치가 아니라 관절값 기록에서 잰 값.
pan_reference_deg: {K1: -33.5, K2: -1.9, K3: 31.2, K4: -46.2, K5: -2.6, K6: 44.6, K7: -70.7, K8: 69.5}
# 쉬는 자세 pan (d2 첫·마지막 프레임 중앙값). R1 '지나침/덜 감' 의 진행 방향 = 이 pan → K 기준 pan.
rest_pan_deg: -4.0
pan_tol_deg: 6            # 준비 때 지금 pan 이 목표 pan ± 이 안이면 ✓ (표시만, 녹화를 막지는 않음). 11-02 사용자: 값보다 대략 위치·방법 → 2.5 에서 넓힘
# pan_offsets_deg: 시나리오 판마다 돌려 쓰는 '처음 어긋남' (pan − 기준, °). 로봇 왼쪽 = pan − , 오른쪽 = pan +.
# lateral_offsets_cm: 대신 큐브 쪽 좌우 거리(cm)로 정하면 K 거리 r 로 pan = atan(cm / r) 환산 (2026-10-30 사용자: R2 오차를 조금 크게, 거리 기준).
# 시연 속도 (2026-10-30): 고치는 동작은 1–2 초에 걸쳐 손목 화면을 보며 (크게 한 번 → 작게 다듬기), 일부러 멈춰 기다리지 않는다.
setup_order_text: "R2 준비 (녹화 안 함): ① 큐브를 K 자리에 계획 각도로 (영상 창 각도 ✓) → ② 그리퍼를 열고 큐브 근처로, 손목 화면 주황 점선 영역에 큐브가 오게 → ③ →"
pace_text: "고칠 때 1–2초에 걸쳐 손목 화면을 보며 (크게 → 작게) · 큐브가 손목 화면 초록 '닫기 영역'에 들어오면 닫기 · 일부러 멈추지 않기"

# 좌우 = 로봇에서 상자를 볼 때 왼쪽/오른쪽 (K 번호 규칙과 같음: K1 = 상자 쪽 줄 로봇 왼쪽).
# wrist_expect: visible = 손목 화면에 큐브가 보여야 함 · edge_or_absent = 가장자리이거나 안 보여도 됨
# count: 파일럿 편수. 0 이면 설계만 하고 계획에 넣지 않는다.
# label: 화면 맨 위 큰 글씨. 화면의 세 위치 (위에서 본 지도 + front 영상 위):
#   계획 위치 (초록 ■) = 큐브 K · 시작 위치 오답 (주황 ✕) = 로봇 밑동에서 Pan 목표 방향, 거리 = 큐브 거리 + start_radial_cm
#   경유 위치 (파랑 ○, via 가 있을 때) = 큐브 바로 위 정렬 지점. 높이는 지도에 안 보여서 start_height 글로.
scenarios:
  # ================================================================ R1 = Shoulder Pan 재탐색·재정렬 (16) — 2026-11-02 작업 지시서 (4차)
  # 실패 모양: 초기 Pan 이 틀림 (A) + 접근 도중 목표를 지나치거나 멀어지는데도 같은 방향으로 계속 감 (B).
  #   A 4 · B1 4 · B2 4 · B3 4. B 는 팔을 일부 편 접근 도중 상태. 오차 상태는 준비 단계(녹화 안 함)에서 안전하게 만들고,
  #   녹화는 올바른 방향으로 되돌리는 행동부터. 틀린 쪽 Pan 이동을 일부러 녹화하지 않는다 (자연스럽게 생긴 오차를 고치는 연속 시연은 허용).
  # 시나리오 조건 (접근 단계 · 손목 가시성 · Pan 오차 크기·방향) 은 경고·수동 확인·재분류(s/d/k/x 키)만 — 녹화를 막지 않는다.
  # 명목 Pan 오차 = 후보 (15·20·25–30°). 정확한 일치를 요구하지 않는다. 실제 값은 시작 관절값·가시성으로 기록.
  # 접근 단계 = 시작 lift 의 '쉬는 자세 → 이 큐브 거리의 d2 파지 lift' 진행률 (start_stages). HOME/MID 고정 관절값을 쓰지 않는다.
  R1-A:
    type: R1
    label: "R1-A · 초기 방향 오류에서 복귀"
    error_kind: initial_direction
    stages: [early]
    wrist_visibility: any
    pan_offsets_deg: [-15, 20, -25, 30]
    start_radial_cm: 0
    start_height: "접근 초반 (팔 거의 접힘)"
    via: ""
    setup_from: rest   # 준비 출발 = 쉬는 자세 pan (rest_pan_deg) → 팔 접은 채 주황으로 돌림 (영상 창 파란 점선 + 경로 화살표)
    x_label: "멈출 곳 = 녹화 시작"
    count: 4
    title: 접근 초반, Pan 이 큐브와 다른 방향을 향함 → 큐브 쪽으로 되돌려 접근
    offset_dir: per_episode
    offset_mag: "Pan 을 큐브 방향보다 왼쪽/오른쪽 15·20·25–30° (후보, 대략)"
    wrist_expect: any
    start: "그리퍼 열림. 팔을 거의 접은 접근 초반 자세에서 Pan 을 주황 선 쪽 (큐브와 다른 방향) 으로 둠."
    demo: "녹화 시작 → Pan 을 초록 선(큐브)으로 되돌리며 팔을 펴 접근 → 파지 → 상자 → 쉬는 자세."
  R1-B1:
    type: R1
    label: "R1-B1 · 접근 중간 Pan 방향 반전"
    error_kind: drift_away
    stages: [mid]
    wrist_visibility: any
    pan_offsets_deg: [-15, 15, -20, 20]
    start_radial_cm: -3
    start_height: "접근 중간 (팔 일부 폄, 그리퍼 탁자 위 5 cm 이상)"
    via: ""
    setup_from: cube   # 준비 출발 = 큐브 방향 (초록 선) → 멀어지는 쪽으로 (영상 창 파란 점선 + 경로 화살표)
    x_label: "멀어져 멈출 곳 = 녹화 시작"
    count: 4
    title: 팔을 펴며 다가가는 도중 Pan 이 큐브에서 멀어지는 쪽으로 감 → 방향을 반대로 바꿔 복귀
    offset_dir: per_episode
    offset_mag: "접근 도중 Pan 이 큐브 방향에서 왼쪽/오른쪽으로 15·20° 벗어남 (후보, 대략)"
    wrist_expect: any
    start: "그리퍼 열림. 준비 단계에서 팔을 일부 펴며 Pan 을 주황 쪽 (큐브에서 멀어지는 쪽) 으로 움직여 멈춤 (탁자 위 5 cm 이상)."
    demo: "녹화 시작 → 바로 Pan 방향을 반대로 (초록 선 쪽) 바꿔 큐브로 접근 → 파지 → 상자 → 쉬는 자세. 멀어지는 쪽으로 더 가지 않는다."
  R1-B2:
    type: R1
    label: "R1-B2 · 큐브 방향 지나침에서 복귀"
    error_kind: overshoot
    stages: [mid, late]
    wrist_visibility: any
    pan_offsets_deg: [-15, 20, -20, 25]
    start_radial_cm: -2
    start_height: "접근 중간·후반 (팔 폄, 그리퍼 탁자 위 3 cm 이상)"
    via: ""
    setup_from: mirror   # 준비 출발 = 큐브 반대쪽 (같은 각도) → 큐브를 지나 멈춤 (영상 창 파란 점선 + 경로 화살표)
    x_label: "지나쳐 멈출 곳 = 녹화 시작"
    count: 4
    title: 큐브 쪽으로 Pan 을 돌리며 오다 큐브 방향을 지나쳐 멈춘 상태 → 되돌아와 접근
    offset_dir: per_episode
    offset_mag: "큐브 방향을 왼쪽/오른쪽으로 15·20·25° 지나침 (반대쪽에서 와서 지나친 것, 후보, 대략)"
    wrist_expect: any
    start: "그리퍼 열림. 준비 단계에서 반대쪽에서 큐브 쪽으로 Pan 을 돌리며 오다 초록 선을 지나 주황 쪽에서 멈춤 (팔 일부 폄)."
    demo: "녹화 시작 → 왔던 방향과 반대로 Pan 을 되돌려 초록 선(큐브) → 접근 → 파지 → 상자 → 쉬는 자세."
  R1-B3:
    type: R1
    label: "R1-B3 · 손목에서 큐브 놓침 → front 로 재탐색"
    error_kind: lost_in_wrist
    stages: [mid, late]
    wrist_visibility: absent
    pan_offsets_deg: [-20, 20, -25, 25]
    start_radial_cm: -3
    start_height: "접근 중간·후반 (팔 폄, 그리퍼 탁자 위 3 cm 이상)"
    via: ""
    setup_from: cube   # 준비 출발 = 큐브 방향 → 손목에서 사라질 때까지 벗어남 (영상 창 파란 점선 + 경로 화살표)
    x_label: "놓쳐 멈출 곳 = 녹화 시작"
    count: 4
    title: 접근 도중 Pan 이 벗어나 손목 화면에서 큐브가 사라진 상태 (front 에는 보임) → 큐브를 다시 찾아 접근
    offset_dir: per_episode
    offset_mag: "손목 화면에 큐브가 안 보일 만큼 (보통 20–25°) 벗어남 (후보, 대략)"
    wrist_expect: edge_or_absent
    start: "그리퍼 열림. 팔을 일부 편 접근 자세에서 Pan 을 주황 쪽으로 벗어나 손목 화면에 큐브가 없게 둠. front 에는 큐브가 보여야 함."
    demo: "녹화 시작 → 큐브 쪽으로 Pan 을 되돌려 손목 화면에 큐브를 다시 찾고 → 접근 → 파지 → 상자 → 쉬는 자세."
  # ---- 3차 지시서 (시작 자세 HOME/MID × 손목 가시성) — 수량 0. practice/r1_try2 (2편 녹화) 를 읽으려고 남김.
  # ---- (3차) R1 = 시작 자세 × 손목 가시성
  # 2026-11-02 작업 지시서 (3차): 잘못된 시작 자세는 준비 단계(녹화 안 함)에서 만들고, 녹화는 그 자세에서 시작 → 고쳐 돌아오는 행동만 기록.
  #   (11-02 오후 '녹화 중 오차 + Space' 방식은 틀린 방향 행동이 녹화되므로 수량 0 으로 남김.)
  #   셀 = 시작 자세 (home_near 쉬는 자세 근처 / mid_approach 접근 중간) × 손목 가시성 목표 (visible_or_edge / absent) 각 4편, 셀 안 왼쪽 2 · 오른쪽 2.
  #   Pan 오차 = K 기준 pan (d2 파지 pan 중앙값) 대비 시작 오차. 기준 자체가 판마다 ±9° 흔들리므로 (11-02 연습) 값은 '명목'이고,
  #   실제 시작 상태는 손목·front 가시성과 시작 관절값으로 기록한다 (pan_error_estimate_confidence).
