# 수집 시작 전 체크리스트 (record 때 Enter 로 하나씩 확인 · preview 는 표시만). R1/R2 혼동 방지.
checklist:
  R1:
    - "이 세션은 R1 = Pan 재탐색·재정렬 (A 초기 방향 · B1 접근 중 반전 · B2 지나침 · B3 손목 놓침). 손가락 미세 어긋남은 R2"
    - "오차 상태는 준비 단계(녹화 안 함)에서 만들고, 녹화는 되돌리는 동작부터. 틀린 쪽으로 일부러 움직이는 장면은 녹화하지 않아요"
    - "그리퍼는 d2 와 같이 열어 둔 채 시작. 편 팔에서는 그리퍼를 탁자에서 띄우고 상자·탁자에 닿지 않게"
    - "시나리오·위치·방향이 계획과 달라도 녹화돼요 (s 시나리오 · d 방향 · k/x 큐브 자리로 바꿔 기록). 막는 것은 안전 조건뿐"
  R2:
    - "이 세션은 R2 = 파지 직전 국소 정렬·깊이·닫힘이에요. 큰 Pan 방향 오차(10° 넘게 틀린 방향)는 R1 세션에서 찍어요"
    - "준비 단계(녹화 안 함)에서 그리퍼를 열고 큐브 근처 오차 자세를 만든 뒤 → — 손목 화면 주황 영역에 큐브"
    - "닫기는 큐브가 초록 닫기 영역에 들어왔을 때 한 번. 빈 파지 후 다시 잡기는 이 시나리오가 아님"
    - "R2-BELOW (손목 화면 아래 가장자리) 는 교정 프로토콜 확정 전 — 계획에 있어도 녹화하지 않아요"

# R1 접근 단계 (4차): 진행률 = (시작 lift − 쉬는 자세 lift) / (이 큐브 거리의 d2 파지 lift − 쉬는 자세 lift).
#   d2 파지 lift (redbox_t1/t3_known 128편, 파지 순간 K 별 중앙값) ≈ −7.5 (r 14 cm) … +44.7 (r 27 cm) → 직선 lift_g = a + b·r.
#   early < 0.4 ≤ mid < 0.85 ≤ late. 대략값 — 표시·기록·경고만.
start_stages: {rest_lift: -103.0, grasp_lift_a: -65.2, grasp_lift_b: 4.04, early_max: 0.4, mid_max: 0.85}   # 직선 맞춤 K 8점 최대 잔차 2.7°
# R1 시작 자세 종류 (관절값으로 대략 분류 · 표시와 기록만). 쉬는 자세 = d2 끝 프레임 lift −103, elbow 92–96.
start_pose_types:
  home_near: {text: "쉬는 자세 근처 (팔 접힘)", lift_max: -80, elbow_min: 70}
  mid_approach: {text: "접근 중간 (팔 일부 폄, 그리퍼 탁자 위 8 cm 이상)"}

# 시작 자세 안전 검사 (녹화 시작 → 키를 막는 BLOCK / 표시만 하는 WARN).
# 관절 한계 = follower 캘리브레이션(range_min/max)을 lerobot 과 같은 식으로 ° 로 바꾼 값 (~±110 pan 등).
safety:
  calibration: $HOME/.cache/huggingface/lerobot/calibration/robots/so_follower/my_arm.json
  limit_margin_block_deg: 5      # 캘리브레이션 한계에서 이 안쪽이 아니면 BLOCK (11-02: 12 → 5, 쉬는 자세는 여전히 막힘)
  limit_margin_warn_deg: 12      # 이 안쪽이 아니면 WARN
  pan_abs_block_deg: 95          # |Pan| 이 이보다 크면 BLOCK (실물 평가의 -109° 이탈 재현 금지, 캘리브레이션 한계 ±110.2°)
  pan_limit_margin_block_deg: 10 # Pan 이 캘리브레이션 한계에서 이 안쪽이 아니면 BLOCK (Pan 기계적 한계 근처 시작 금지)
  gripper_open_min: 15           # 표시만 (WARN, 11-02 BLOCK 에서 내림). R1/R2 시작은 열린 그리퍼 (d2 접근 구간 그리퍼 p50 28.2, p1 7.0)
  leader_follower_diff_block_deg: 25   # 팔 관절 리더−팔로워 차이가 이보다 크면 BLOCK (무언가에 막혀 밀고 있음)
  leader_follower_diff_warn_deg: 10
  # d2 256편의 '처음 열기 → 처음 닫기' 구간 상태 p0.5–p99.5 (2026-10-30 계산, 05_preview_test_results.md). 밖이면 WARN.
  d2_approach_envelope:
    shoulder_pan:  [-105.8, 101.0]
    shoulder_lift: [-30.4, 57.5]
    elbow_flex:    [-62.8, 58.0]
    wrist_flex:    [44.9, 96.0]
    wrist_roll:    [-55.3, 50.6]
  setup_max_s: 3600              # 준비(녹화 안 함) 단계 최대 길이 — 시간 초과로 녹화가 저절로 시작되지 않게 길게
