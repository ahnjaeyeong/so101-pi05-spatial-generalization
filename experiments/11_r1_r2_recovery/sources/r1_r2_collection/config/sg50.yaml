    start: "쉬는 자세 (d2 와 같음). 그리퍼 닫힘."
    demo: "평소대로 접근 → 그리퍼 열기 → 고정된 쪽을 큐브 벽에 맞추고 닫기 → 상자 → 쉬는 자세 (단계 순서는 예비 시연에서 확정)"
