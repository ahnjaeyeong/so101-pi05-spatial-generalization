    N7: {confirmed: false, d2_trained: near_random, d2_nearest_cm: 0.5, d2_within_5cm: 9, d_eval_cm: 8.3}
    N8: {confirmed: false, d2_trained: near_random, d2_nearest_cm: 0.0, d2_within_5cm: 8, d_eval_cm: 3.6}
