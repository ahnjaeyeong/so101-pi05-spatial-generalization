    max_base_dist_cm: null   # 사용자 최대거리 (sg_reach.py 로 잼) — 정하면 regions --write --replace 로 점 다시 (녹화 전만)
  # 2026-11-12 sg_pin 영역 무작위 점 (K#p#, sg_plan.py regions --pin): known_regions 조건에서 아래 값만 바꿈. K#r# (예비3) 은 그대로.
  pin_regions:
    per_region: 8
    min_between_cm: 2.0            # 2.5 cm 로는 K1 영역에 8 점이 안 들어감 (seed 40 개 모두 실패) → 2.0
    min_between_fallback_cm: 1.5   # 그래도 안 들어가는 영역 (K7 · K8: 수직 거리 한계 · 어려운 영역 · 평가 자리) 은 남은 점만 1.5 cm
    seed: 5643                     # seed 5611–5710 중 1.5 cm 간격 점이 가장 적은 것 (4 점: K7 3 · K8 1)
  # 2026-11-13 방해물 (그룹 distractors: true, sg_plan.assign_distractors). d2 T3 와 같은 물건: 2.5 cm 색 큐브 노랑 · 주황 · 파랑 · 초록 (색마다 5 개 있음).
  #   개수 = d2 T3 무작위 판 비율 (2–6 개). '가장 가까운 방해물' 을 거리 near / far 절반씩 × 방향 4 가지 (큐브 기준 로봇 쪽 · 상자 쪽 · 로봇 왼쪽 · 오른쪽) 로 고르게,
  #   나머지는 그보다 gap_cm 넘게 먼 무작위 자리. near = 접근 중 손목 화면에 같이 들어오는 거리, far = front 화면에만 보이는 거리 (추정 — 연습 판에서 확인).
  #   방해물 각도는 정하지 않음 (d2 T3 무작위 판과 같음). 놓을 수 있는 곳 = area_cm 안 · front 화면 안 · 집기 어려운 영역 (쉬는 팔 아래) 밖 · 로봇 밑동 base_keepout_cm 밖.
  distractors:
    colors: [yellow, orange, blue, green]
    max_per_color: 2
    counts: {2: 13, 3: 13, 4: 13, 5: 13, 6: 12}
    near_cm: [5.0, 7.0]
    far_cm: [9.0, 14.0]
    jitter_deg: 25
    gap_cm: 1.5
    min_between_cm: 3.5
    quantize_cm: 0.5
    area_cm: {x: [-30.0, -3.0], y: [-13.0, 36.0]}
    base_keepout_cm: 9
  # 평가 전용 자리 — 수집 위치에서 뺀다 (계획 만들 때 ≥ eval_min_dist_cm 검사, 어기면 계획 거부)
  eval_reserved:
    min_dist_cm: 3.5
    sources:
      - "H U1–U8: ~/so101_boxpick/config/redbox8_heldout_h.yaml (평가 전용, 좌표 미확정)"
      - "파일럿 U (rft01_real_pilot · r2_grasp_diagnostic): U1 (−6.5,15.5) U2 (−8.5,−7.0) U7 (−15.5,2.0) U8 (−20.5,26.5)"
    points:
      H_U1: [-24.1, 32.0]
      H_U2: [-26.1, -13.0]
      H_U3: [-10.6, 9.5]
      H_U4: [-11.1, -7.0]
      H_U5: [-8.6, 30.0]
      H_U6: [-22.6, -1.5]
      H_U7: [-14.6, 20.0]
      H_U8: [-5.6, 21.0]
      pilot_U1: [-6.5, 15.5]
      pilot_U2: [-8.5, -7.0]
      pilot_U7: [-15.5, 2.0]
      pilot_U8: [-20.5, 26.5]
  split_default: train_candidate   # 이 50편을 평가에 쓰려면 학습 전에 정해서 split 을 바꾼다 (sg_plan.py split)
  # 2026-11-09 접근 경로 다양화 (overshoot_diag/11_bias_results.md P11: 사람 시연 82 % 가 높은 곳에서 카메라 쪽 (바깥) 으로 1 cm 넘게
  #   지나갔다가 내려오며 되돌아옴 → 정책이 '카메라 쪽으로 가기' 를 배운 것으로 봄). 방향 = 큐브 기준 그리퍼가 오는 쪽.
  #   radial: + = 로봇에서 먼 쪽 (바깥, 지금 손목 카메라 쪽), side: + = 숄더팬 + 쪽 (= 로봇 오른쪽). from_above = 위에서 내려옴.
  #   wrist = 손목 화면에서 큐브가 들어오는 쪽 (du ≈ −0.077 / cm 팬+ 쪽, dv ≈ +0.075 / cm 바깥 — 예비3 창 회귀).
  approach:
    A:  {name: "위에서 하강", short: "위→", radial: 0, side: 0, from_above: true,
         text: "지금 방식: 높은 곳에서 손목 프레임을 맞춘 뒤 내려옴"}
    B:  {name: "안쪽에서 수평", short: "안쪽→", radial: -1, side: 0,
         text: "큐브 안쪽 (로봇 쪽) 에서 잡는 높이까지 먼저 내려간 뒤 바깥으로 밀고 나감"}
    C:  {name: "바깥에서 수평", short: "바깥→", radial: 1, side: 0,
         text: "큐브 바깥 (카메라 쪽) 에서 잡는 높이까지 먼저 내려간 뒤 안쪽으로 당겨 옴"}
    D+: {name: "오른쪽에서 수평", short: "오른쪽→", radial: 0, side: 1,
         text: "큐브 로봇 오른쪽 (팬 + 쪽) 에서 잡는 높이로 수평 진입"}
    D-: {name: "왼쪽에서 수평", short: "왼쪽→", radial: 0, side: -1,
         text: "큐브 로봇 왼쪽 (팬 − 쪽) 에서 잡는 높이로 수평 진입"}
    E:  {name: "지나쳤다 복귀", short: "지나침↩", radial: -1, side: 0, overshoot: true,
         text: "안쪽에서 들어와 바깥 (카메라 쪽) 으로 1–2 cm 지나간 뒤 되돌아와 멈춤"}
  # 2026-11-09 계획 시작 자세 (그룹 start_pose: planned). 팔 접힘 = 실제 녹화된 관절값 (새 자세를 만들지 않음) · 팬 = 큐브 방향 (pan_ref) + 오프셋.
  #   팬 + = 로봇 오른쪽. |팬| ≤ abs_max (safety pan_abs_block_deg 95 보다 안쪽) — 넘으면 반대쪽, 그래도 넘으면 작은 오프셋.
  start_pan:
    offsets: [-60, -30, 30, 60]
    abs_max: 85
  start_tol: {shoulder_pan: 8, shoulder_lift: 10, elbow_flex: 10, wrist_flex: 12, wrist_roll: 12, gripper: 6}
  start_folds:
    F0: {name: "접힘 (S0 팔)", joints: {shoulder_lift: -102.9, elbow_flex: 95.3, wrist_flex: 77.8, wrist_roll: 92.9, gripper: 1.2},
         source: "S0 (위)"}
    F1: {name: "반쯤 편 팔", joints: {shoulder_lift: -40.9, elbow_flex: 54.8, wrist_flex: 51.7, wrist_roll: 91.2, gripper: 1.2},
         source: "예비3 40편 그리퍼 연 뒤 lift 가 닫기 때와 반쯤 온 프레임의 팔로워 중앙값 (sd lift 9.2 · elbow 9.4 · wflex 9.8); 그리퍼는 닫힘 1.2 로"}
    F2: {name: "높이 든 팔 (상자 위)", joints: {shoulder_lift: 34.1, elbow_flex: -40.1, wrist_flex: 70.3, wrist_roll: 92.9, gripper: 1.2},
         source: "P3 (d2 상자 위 놓기 순간 중앙값) 팔 + S0 손목 회전"}
    F3: {name: "접힘 · 손목 안 돌림 (P0)", joints: {shoulder_lift: -102.9, elbow_flex: 95.3, wrist_flex: 65.5, wrist_roll: 2.5, gripper: 1.2},
         source: "P0 (d2 256편 첫 프레임 평균)"}
  # 손목 화면 절차 안내 (그룹 procedure_guide: true): 녹화 중 위에서부터 처음 안 된 단계 하나를 크게 씀. 판정 · 자동 동작 아님.
  #   1 숄더팬 (|팬 − 큐브 방향 pan_ref| ≤ pan_tol, 한 번 맞으면 그 판에서 넘어감) → 2 그리퍼 열기 (시작 + 8, 한 번) →
  #   3 각도 (손목 화면 큐브 회전 ≤ 회전 허용, 가까운 쪽으로 — 45° 근처는 처음 고른 쪽을 그 판에서 유지) → 4 높이 (end_condition) →
  #   5 주황 프레임 (u · v · 크기) → 유지 hold_s → '닫으세요'.
  procedure:
    pan_tol_deg: 6
    angle_tol_deg: 5      # 2026-11-09 3 → 5 (3판 시험 닫을 때 회전 4–7°)
    # 2026-11-10 사용자 "중간에 그리퍼를 열고 크레인 자세 만들고 가는거" (그룹 crane_step: true): 그리퍼 연 뒤 손목 수직 (수평계 목표 ± tilt_tol) ·
    #   그리퍼 끝이 잡는 높이 (end_condition.height_cm) 보다 min_above_cm 위 → 한 번 맞으면 통과. 관절값은 고정하지 않음 (큐브 자리마다 팔꿈치로 큐브 위).
    #   pilot4 ep2 시작 크레인 (lift 3.9 · elbow 13.4 · wflex 82.7): FK 끝 반지름 20.7 cm · 잡는 높이 +5.3 cm · 기울기 +0.5°.
    crane:
      tilt_tol_deg: 5
      min_above_cm: 4.0
    # 2026-11-10 사용자 "크레인 자세를 하고 서보를 통제 … 오 한번 해봐" (그룹 height_comp: true): 크레인 높이에서 (높이 보정한) 주황에 앞뒤 · 좌우만 맞춤 →
    #   수직으로만 내려감. align_min_h_cm 위에서 u · v 가 align_tol 안이면 '맞춤' 통과, 내려가는 동안 drift_tol 넘으면 '위치가 샜어요'.
    align_tol_uv: 0.035
    align_min_h_cm: 1.5
    drift_tol_uv: 0.05
  # 2026-11-10 높이 보정 주황 (그룹 height_comp): 그리퍼가 잡는 높이보다 h cm 위일 때 닫기 자리 큐브가 손목 화면에서 보여야 할 자리 = (u, v + dv(h)) · 크기 size(h).
  #   값 = 수평 위치가 닫은 자리 ±0.4 cm 안 · 높이 0–8 cm 장면 (예비3 40 편 + 연습 pilot5–7 9 판, 2,807 장면) 의 0.5 cm 묶음 중앙값을 이은 표.
  #   4 cm 넘게는 측정이 적어 곡선 dv = −0.524·h/(h+6.48), 크기 = 11.32/(11.32+h) 로 채움. 오차 ±0.04 (dv) 정도 — 참고 안내. 닫기 판정은 실제 주황 (h = 0).
  # 2026-11-10 사용자 "너무 어려운데 … 안 맞는거 같아 … 숄더팬 → 그리퍼 엶 → 큐브 상단까지 이동 → 대기 및 프레임 맞춤 → 하강 후 집기 → 넣기" (그룹 hover: true).
  #   큐브 위 한 높이 (height_cm ± tol, FK 끝, 잡는 높이 기준) · 손목 수직 (± tilt_tol) 에서 '상단 프레임' (노랑) 에 맞추고 wait_s 대기 → 수직으로 내려가 주황 (닫기 자리) 에서 집기.
  #   상단 프레임 = 수평이 닫은 자리 ±0.4 cm · 높이 2.5–3.5 cm · 손목 수직 ±4° 장면 33 개 (예비3 + pilot5–7) 중앙값: du −0.018 · dv −0.223 · 크기 0.84
  #   (흩어짐 sd du 0.018 · dv 0.041 · 크기 0.027 → 허용 ±0.04 · ±0.08, 위에서는 대략 맞춤, 정확한 맞춤은 아래 주황).
  hover:
    height_cm: 3.0
    height_tol_cm: 1.5
    # 2026-11-10 연습 3판 (pilot9): 상단 프레임 실제 (+3.0 cm · 기울기 5°) 와 차 dv 0.000 · ep1 은 기울기 +15° 로 못 넘어감 · 큐브 위 머문 시간 최대 약 12 s
    #   → tilt_tol 5 → 8°, tol_uv 0.04 → 0.05 (위에서는 대략 맞추고 빨리 내려가게). 프레임 값은 그대로.
    # 2026-11-10 연습 3판 (pilot10) 뒤 사용자 "허용 범위를 조금 넓게": ep2 (K8r3) 는 화면 3 가지는 대부분 맞았지만 기울기 −12° 로 못 넘어감.
    #   큐브 위 장면 통과 비율 (pilot9 · pilot10 6 판): 이전 38 · 0 · 74 · 25 · 16 · 0 % → 아래 값 51 · 12 · 74 · 70 · 18 · 48 %.
    #   기울기 8 → 15° (30° 가까이 기울면 상단 프레임이 크게 달라져 남김) · uv 0.05 → 0.06 · 크기 0.08 → 0.10 · 높이 ±1.0 → ±1.5 cm (위 height_tol_cm).
    tilt_tol_deg: 15
    frame: {du: -0.018, dv: -0.223, size: 0.84}
    tol_uv: 0.06
    tol_size: 0.10
    wait_s: 0.5
    bottom_warn_h_cm: 1.0   # 이 높이 아래에서 큐브가 주황보다 dv > overshoot_warn.dv_thr 면 '지나쳤어요'
  height_comp:
    h:    [0, 1, 2, 3, 4, 6, 8]
    dv:   [0.0, -0.05, -0.135, -0.19, -0.20, -0.25, -0.29]
    size: [1.0, 0.99, 0.88, 0.81, 0.74, 0.65, 0.59]
  # 2026-11-09 사용자 "손목 카메라에서 위로 들때 노란색 점선으로 큐브를 먼저 맞추게 하고 주황색 큐브로 돌아오게 … 다양한 위치 … 아래부분에서도".
  #   판마다 노란 프레임 = 주황 닫기 자리 (ref-v5) 윤곽을 화면에서 dir 방향으로 dist 만큼 옮기고 size 배로 줄인 것 (작게 = 더 높은 곳).
  #   dir: 화면 기준 0 = 오른쪽, 90 = 아래, 180 = 왼쪽, 270 = 위 (8 방향 고르게). dist = 화면 폭 비 (세로는 같은 px 로 환산).
  #   큐브 윤곽이 화면 안 (margin) 에 다 들어오는 거리 · 크기만 씀 — 안 되면 거리를 줄이고 (min_dist 까지) 크기를 작게.
  #   노랑은 지나가는 점: 맞으면 (tol) 그 판에서 통과, 기다리지 않음 (정책 입력 영상에는 노란 선이 없음).
  waypoint:
    dirs: [0, 45, 90, 135, 180, 225, 270, 315]
    dist: [0.12, 0.22]
    min_dist: 0.07
    size: [0.70, 0.85]
    margin: 0.02
    tol_uv: 0.04
    tol_size: 0.08
    # 2026-11-10 사용자 (3판 시험 뒤 "노란색을 일부러 맞추기가 쉽지않네 … 숄더팬을 잘 돌리면 사실 거의 맞거든") → 1 번 안 "내려오는 축 하나":
    #   위 (270°, 로봇 쪽 · 높이) 3 : 아래 (90°, 카메라 쪽에서 당겨 오기) 1. dirs 는 이 dir_mix 가 있으면 안 씀 (8 방향은 이전 설계).
    # 2026-11-10 사용자 "강한 보정을 얻고 싶으면 노란색 큐브가 꽤 벌어져있어야 … 화면 아래로 짤려도 되게": 카메라 쪽 (아래 · 아래 대각) 2 : 로봇 쪽 (위) 1.
    #   카메라 쪽은 잡는 높이 근처 (크기 0.90–1.00) · dv ≈ +0.06 … +0.15 (≈ 0.8–2 cm 바깥, 정책 실패 때 +0.03…+0.10) — 화면 아래로 잘려도 됨 (보이는 넓이 ≥ bottom_visible_min).
    #   (이전: 위 3 : 아래 1, 아래 0.06–0.09 · 0.86–0.95, 다 보이게)
    dir_mix: {"270": 2, "90": 2, "60": 1, "120": 1}
    dist_by_dir: {"270": [0.06, 0.11], "90": [0.05, 0.11], "60": [0.055, 0.12], "120": [0.055, 0.12]}
    size_by_dir: {"270": [0.85, 0.95], "90": [0.90, 1.00], "60": [0.90, 1.00], "120": [0.90, 1.00]}
    allow_bottom_clip: true
    bottom_visible_min: 0.55
  # 2026-11-10 사용자 "응 한번해봐" (지나침 경고): 노랑을 지난 뒤 주황 단계에서
  #   (a) 노랑이 위 · 옆 (아래 띠 45–135° 아님) 인데 큐브가 주황보다 dv > dv_thr (화면 아래 = 그리퍼가 카메라 쪽으로 샘) 또는
  #   (b) 큐브가 노랑 반대편으로 주황을 px_thr 넘게 지나감 → 주황 점선 빨강 + '지나쳤어요' 빨강 깜빡임. 판정 · 자동 동작 아님.
  overshoot_warn:
    dv_thr: 0.04          # ≈ 0.5 cm 바깥 (dv +0.075 / cm, 예비3 창 회귀)
    px_thr: 20            # 노랑 → 주황 방향으로 주황을 지난 거리 (원본 640×480 px)
  # 2026-11-12 새 절차 (그룹 pin: true). 사용자: "숄더팬 정렬 → 그리퍼 개방 → 손목카메라 핀포인트에 큐브 정렬 → 핀포인트 최대한 맞추면서 수직으로 손목서보 정렬
  #   → 다시 한번 핀포인트에 큐브정렬 → 그리퍼 회전 → 닫음 → 박스에 놓기". 검토 뒤 (같은 날) 회전은 큐브 위 높이에서 하고 그 뒤 수직으로 내려가 확인 · 닫기.
  #   화면 단계: 1 숄더팬 · 2 그리퍼 · 3 첫 맞춤 (노랑 = 상단 프레임에서 판마다 정한 방향으로 entry.dist 옮긴 자리, 한 번 맞으면 통과) ·
  #   4 손목 수직 (|기울기| ≤ vertical_tol, 한 번) · 5 다시 맞춤 (노랑 = 상단 프레임 sg50.hover.frame, 높이 hover.height_cm ± height_tol · 수직 1.5 배 안, wait_s 유지) ·
  #   6 회전 (손목 화면 큐브 회전 ≤ procedure.angle_tol_deg, 0° 큐브는 바로 통과) · 7 수직으로 내려가 주황 (end_condition) · 8 유지 hold_s → 닫으세요.
  #   판정 · 자동 동작 아님. 첫 맞춤 방향: 화면 0 = 오른쪽 · 90 = 아래 (그리퍼가 카메라 쪽으로 더 나간 상태) · 180 = 왼쪽 · 270 = 위 (덜 나간 상태).
  pin:
    entry:
      dirs: [0, 90, 180, 270]
      dist: [0.08, 0.13]      # 화면 폭 비 (≈ 1–1.7 cm, dv 0.075 / cm 기준). 화면 밖이면 min_dist 까지 줄임
      min_dist: 0.05
      margin: 0.02
      tol_uv: 0.05
      tol_size: 0.12
    vertical_tol_deg: 8
    align: {tol_uv: 0.04, tol_size: 0.10}
    wait_s: 0.3               # 다시 맞춤이 맞은 채 유지할 시간 (스쳐 지나가는 것만 거름 — 멈춰 기다리게 하지 않음)
    hold_s: 0.7               # 닫기 전 유지 (end_condition.hold_s 1.5 대신 — 2026-11-12 실물 평가: 정책이 열린 채 46 s 머묾 → 멈춤을 짧게)
  # 정답조건 (화면 안내 · 판 뒤 검사 — 녹화 · 닫기를 막거나 자동으로 하지 않음). 값 = 예비3 40편 닫기 순간 (overshoot_diag):
  #   FK 그리퍼 끝 높이 중앙 −1.85 cm (sd 0.42, p10 −2.32 · p90 −1.46) · 손목 크기 1.005 ± 0.014 · du 0.003 ± 0.016 · dv 0.003 ± 0.020.
  end_condition:
    # 2026-11-09 사용자 (sg50_rot_pilot 3판 — 닫을 때 0/3 맞음: dv +0.07 · −0.06, du −0.07, 크기 1.08–1.09) "정답조건 완화하자":
    #   tol_uv 0.02 → 0.03 · tol_size 0.03 → 0.05 · tol_height_cm 0.5 → 0.7 (procedure.angle_tol_deg 3 → 5)
    tol_uv: 0.03          # 닫기 자리 (ref-v5) 와 화면 위치 차 (0–1)
    tol_size: 0.05        # 크기 비 (= ref-v5 허용) — 아래 size_range 가 있으면 그것을 씀
    # 2026-11-10 시험 9판 닫을 때 크기: 0° 큐브 1.00 · 1.01 / 돌린 큐브 (30 · 45°) 1.04–1.09, 같은 판 FK 높이 −0.79…+0.55 cm (허용 안 6/9)
    #   → 돌린 큐브는 같은 높이에서도 손목 화면에 크게 보임 → 크기 허용 0.95–1.10 (높이는 FK 높이 조건이 봄)
    size_range: [0.95, 1.10]
    height_cm: -1.85      # FK 그리퍼 끝 높이 목표 (sg_fk, 0 = FK 원점)
    tol_height_cm: 0.7
    hold_s: 1.5           # 네 가지가 다 맞은 채 유지할 시간 (그 뒤 닫기) — 2026-11-10 0.5 → 1.5 (정책 계획 길이 1.7 s 안, 사람 예비3 0.3 cm 안 머문 시간 중앙 2.1 s)
    wp_to_target_s: 2.0   # 2026-11-10 노랑을 지난 뒤 주황까지 '한 번에' 안내 (판정 아님)
    overshoot_ok_cm: 0.5  # 판 뒤 검사: 닫기 위치보다 바깥으로 이만큼 넘게 지나가면 '지나침' (E 유형은 1–2 cm 가 목표)

