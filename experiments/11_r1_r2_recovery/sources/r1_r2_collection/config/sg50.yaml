    N4: {confirmed: false, d2_trained: near_random, d2_nearest_cm: 0.6, d2_within_5cm: 12, d_eval_cm: 3.7}
    N5: {confirmed: false, d2_trained: near_random, d2_nearest_cm: 1.5, d2_within_5cm: 6, d_eval_cm: 3.6}
