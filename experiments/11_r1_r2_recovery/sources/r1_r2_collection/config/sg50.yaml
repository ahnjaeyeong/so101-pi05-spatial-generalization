# SG50 — 공간 일반화 추가 시연 약 50편 (2026-11-05 작업 지시 "큐브 위치 · 팔 시작 자세 다양화, 파지 관계는 일정")
#   설계 · 사용법: 13_sg50_sticker.md. 이 파일은 r12_scenarios.yaml 위에 덧씌운다 (기존 R1/R2/RC 설정 · 세션은 그대로).
#   사용: tools/r12_collect.py <명령> --config config/sg50.yaml (--group sg50_pilot | --session main_k8/sg50_main)
#
#   고정: 큐브 회전각 0° (아래 cube_rotation 정의) · 큐브 크기 2.5 cm · 빨간 큐브 + 흰 스티커 · 카메라 위치 · 보정 · 조명 · 서보 설정.
#   다양화: 큐브 위치 (positions) · 팔 시작 자세 (start_poses).
#   준비 단계 (녹화 안 함) 에서 큐브를 놓고 시작 자세를 만든 뒤 → 로 녹화. 시작 자세 ✓/◇ 는 표시 · 기록만 (녹화를 막지 않음).
