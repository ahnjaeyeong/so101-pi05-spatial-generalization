tasks:
  t1:
    task: pick up the red cube and put it in the brown box   # practice_50 과 같은 문장
    red_cubes: 1
    distractors: {count: 0, pool: []}
    qa: {len_s: [10, 40]}       # 2.5 cm 큐브 시험 녹화 14–18 초 (2026-10-13)
    known_layouts: auto         # 위치마다 하나 → K1–K4 × 16편
  t2:
    task: put all the red cubes in the brown box
    red_counts: {2: 24, 3: 24, 4: 16}   # 빨강 개수: 편수 (2026-10-14 사용자 결정 — 3개 고정 대신 2~4개 섞기)
                                # Known: 2개 C(4,2)=6가지×4 · 3개 4가지×6 · 4개 1가지×16 → K 마다 46번
                                # Random: 판마다 개수를 정함 (배치 ID 끝 nK), 8판 묶음(2개 3·3개 3·4개 2)씩 섞음
    distractors: {count: 0, pool: []}
    qa: {len_s: [15, 75]}       # 시험 녹화 3개 24–35 초 → 4개까지 고려해 본 수집 episode_time_s 75
    known_layouts: auto         # 개수마다 네 위치 중 그 개수를 고르는 모든 조합 (편수는 똑같이)
  t3:
    task: pick up the red cube and put it in the brown box   # T1 과 같은 지시, 장면만 다르다
    red_cubes: 1
    # 2026-10-15 사용자 결정: 방해 물체 색·개수를 판마다 섞는다 (이전: 파랑·초록 2개 고정, 사전 정의 16배치).
    # 색은 pool 에서 중복 허용으로 뽑되 세션 전체에서 색마다 거의 같은 수, 한 판에 한 색 max_per_color 개까지 (실물 5개씩).
    # Known: 빨강 K1–K4 16편씩, 방해는 빨강이 안 쓰는 K 에 1–3개. Random: 자유 배치 2–6개 (배치 ID 끝 -YOBG = 방해 색).
    distractors:
      pool: [yellow_cube, orange_cube, blue_cube, green_cube]
      counts: {known: {1: 16, 2: 24, 3: 24}, random: {2: 12, 3: 13, 4: 13, 5: 13, 6: 13}}
      max_per_color: 5
    qa: {len_s: [8, 45]}        # 2026-10-15 사용자: 빨강 1개만 집어 9.6–9.9 초 판이 정상 → 최소 10 → 8 초
    touching_ok: true           # 2026-10-15 사용자: 자유 배치에서 붙여 놓아도 됨 (잡기 연습) — 간격 규칙 문구·검사를 뺀다
    known_layouts: auto

# 그룹 = 원본 수집 단위 (세션 하나 = LeRobot 데이터셋 하나). seed 를 바꾸면 다른 계획이 된다.
groups:
  t1_known:  {task: t1, mode: known,  episodes: 64, seed: 1101, session: main/redbox_t1_known,  repo_id: oxr/so101_redbox_t1_known}
  t1_random: {task: t1, mode: random, episodes: 64, seed: 1102, session: main/redbox_t1_random, repo_id: oxr/so101_redbox_t1_random}
  t2_known:  {task: t2, mode: known,  episodes: 64, seed: 1201, session: main/redbox_t2_known,  repo_id: oxr/so101_redbox_t2_known}
  t2_random: {task: t2, mode: random, episodes: 64, seed: 1202, session: main/redbox_t2_random, repo_id: oxr/so101_redbox_t2_random}
  t3_known:  {task: t3, mode: known,  episodes: 64, seed: 1301, session: main/redbox_t3_known,  repo_id: oxr/so101_redbox_t3_known}
  t3_random: {task: t3, mode: random, episodes: 64, seed: 1302, session: main/redbox_t3_random, repo_id: oxr/so101_redbox_t3_random}

# check_dataset.py 색 검출 (OpenCV HSV: H 0–180, S·V 0–255). 각 색은 범위 목록의 합집합.
# red 근거 (2026-10-13 기존 세션 측정): 큐브 H 172–178 S 120–230 (practice_10 노란 화면에서는 H 11–15 S 215+),
#   갈색 상자 H 8–16 S 120–160 V 70–90 → 주황 쪽(H≤18)은 S≥190 일 때만 빨강으로 본다.
# 노랑·주황·파랑·초록: 2026-10-15 front 사진(5색 큐브 한 줄)으로 측정 — 아래 색마다 주석.
detection:
  min_blob_area_px: 100          # 2.5 cm 큐브: 탁자 위 ≈1100 px², 상자 안 벽에 가려지면 164–296 px² (2026-10-13 시험 녹화). 예전 300 은 5.3 cm 큐브 기준
  min_blob_area_in_box_px: 40   # 끝 화면 상자 안 빨강을 셀 때만 — 앞 벽 바로 뒤에 들어가면 88 px² 까지 작아짐 (2026-10-14 본 수집 ep008)
  in_box_open_px: 3             # 상자 안 개수의 잡음 지우기 크기 — 5 면 앞 벽 위 3–4 px 띠만 보이는 큐브가 지워짐 (2026-10-14 T1-K ep019·025)
  cube_area_px: [904.6, 1.982, -0.2207, -0.0031]   # 탁자 위 큐브 한 개 넓이 a = c0 + c1·y + c2·x + c3·y² (front 640x480 px). T1 128판으로 맞춤 (2026-10-15) — 낱개 0.88–1.14배
  cluster_split_ratio: 1.1      # 붙은 덩어리 큐브 수 = round(넓이 / (한 개 넓이 × 이 값)). 붙은 2·3·4개 = 2.1·3.0–3.3·4.5배
  cube_area_scale: {green: 0.90, orange: 0.85, blue: 1.0, yellow: 0.83}   # 색마다 검출 넓이 / 빨강 (같은 2.5 cm 큐브, 2026-10-15 5색 사진 5장: 주황 0.70–0.78)
  in_box_margin_px: 10          # 상자 사각형을 이만큼 넓혀서 안/밖 판정
  position_tol_px: 25           # 계획 위치(화면 투영)와 검출 위치 차이 허용
  distractor_move_tol_px: 20    # 방해 물체가 처음보다 이만큼 넘게 옮겨지면 ⚠
  grip_dip_min: 5               # 그리퍼 잡았다 놓기 판정 (열린 구간 안에서 이만큼 닫혔다 열림). 2.5 cm 큐브는 조금만 열어 7 정도 (기본 8)
  colors:
    red:                         # 2026-10-15 5색 사진: 빨강 큐브 H 171–179 (+0–2 조금) · 주황 큐브 H 2–12 → 빨강은 H ≤1 까지만
      - {h: [160, 180], s: [90, 255], v: [60, 255]}   #   (이전 {0–6, S≥150} · {0–18, S≥190} 은 주황을 빨강으로 셈. T1·T2 QA 다시 돌려 확인)
      - {h: [0, 1],     s: [90, 255], v: [60, 255]}
    orange:                      # 주황 큐브 H 2–12 S 84–181 V 98–180. 갈색 상자 H 2–18 S ≤165 V ≤141 와 겹쳐서 V≥130.
      - {h: [3, 13],    s: [120, 255], v: [130, 255]}   # S 150 → 120 (10-15 T3-R ep046: 흐린 주황 S 중앙 147 이 반만 잡힘). T1·T2 첫 화면 오검출 ≤14 px, 덩어리 0
    yellow:                      # 노랑 큐브 H 23–29 S 84–179 V 102–168. 상자 벽·바닥 H 19–22 S ≤127 V ≤124 → H≥22·S≥120·V≥120
      - {h: [22, 34],   s: [120, 255], v: [120, 255]}
    blue:                        # 파랑 큐브 H 98–109 S 85–234 V 71–144 (2026-10-15 실측, 범위 그대로)
      - {h: [95, 130], s: [80, 255], v: [40, 255]}
    green:                       # 초록 큐브 H 63–75 S 83–158 V 83–115 (2026-10-15 실측, 범위 그대로)
      - {h: [40, 85],  s: [70, 255], v: [40, 255]}
